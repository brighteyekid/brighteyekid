<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="fg" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0L0 0 0 30" fill="none" stroke="#0e141e" stroke-width="0.4"/>
    </pattern>
    <linearGradient id="topFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#cc0000;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect width="900" height="180" fill="#0d1117"/>
  <rect width="900" height="180" fill="url(#fg)"/>

  <!-- Faded BIG background type -->
  <text x="-6" y="162" font-family="Impact,'Arial Black',Arial,sans-serif" font-size="155" fill="#0a0e16">BUILD FAST.</text>

  <!-- Top red separator bar -->
  <rect x="0" y="0" width="900" height="2" fill="#cc0000"/>

  <!-- Faint glow from top bar -->
  <rect x="0" y="0" width="900" height="30" fill="#cc0000" opacity="0.02"/>

  <!-- Section label -->
  <text x="450" y="42" font-family="'Courier New',Courier,monospace" font-size="8.5" fill="#1e2030" letter-spacing="4" text-anchor="middle">007 — ESTABLISH CONTACT</text>

  <!-- OPEN CHANNEL -->
  <text x="450" y="82" font-family="Impact,'Arial Black',Arial,sans-serif" font-size="38" fill="#ffffff" letter-spacing="2" text-anchor="middle">OPEN CHANNEL</text>

  <!-- Red accent under headline -->
  <rect x="388" y="88" width="124" height="2" fill="#cc0000"/>

  <!-- Email -->
  <text x="450" y="112" font-family="'Courier New',Courier,monospace" font-size="9" fill="#2a2a4a" letter-spacing="2" text-anchor="middle">CB2117@SRMIST.EDU.IN  ·  CHENNAI  ·  GMT+5:30</text>

  <!-- Links row -->
  <text x="316" y="134" font-family="'Courier New',Courier,monospace" font-size="9" fill="#252540" letter-spacing="3" text-anchor="middle">GITHUB</text>
  <line x1="358" y1="130" x2="378" y2="130" stroke="#181825" stroke-width="0.6"/>
  <text x="450" y="134" font-family="'Courier New',Courier,monospace" font-size="9" fill="#252540" letter-spacing="3" text-anchor="middle">LINKEDIN</text>
  <line x1="520" y1="130" x2="540" y2="130" stroke="#181825" stroke-width="0.6"/>
  <text x="584" y="134" font-family="'Courier New',Courier,monospace" font-size="9" fill="#252540" letter-spacing="3" text-anchor="middle">EMAIL</text>

  <!-- Blinking status left -->
  <circle cx="20" cy="160" r="3.5" fill="#cc0000">
    <animate attributeName="opacity" values="1;0.1;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="34" y="164" font-family="'Courier New',Courier,monospace" font-size="8" fill="#1a1a30" letter-spacing="2">AVAILABLE 2026</text>

  <!-- Right tag -->
  <text x="886" y="164" font-family="'Courier New',Courier,monospace" font-size="7.5" fill="#111120" text-anchor="end" letter-spacing="1">CHANDRA-IS-DEV.VERCEL.APP</text>

  <!-- Bottom red close bar -->
  <rect x="0" y="175" width="900" height="5" fill="#cc0000"/>
  <rect x="0" y="175" width="3" height="5" fill="#ff2020"/>
</svg>
